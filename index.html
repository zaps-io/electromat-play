<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZAPS EMPIRE</title>
    <link rel="icon" href="assets/brand/zaps-wordmark-only-red.svg?v=canon-1823" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Barlow+Condensed:wght@500;600;700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=empire-aoe" />
  </head>
  <body>
    <canvas id="world"></canvas>

    <header class="res-bar panel" aria-label="Resources">
      <img class="wordmark" src="assets/brand/zaps-wordmark-only-cream.svg?v=canon-1823" alt="Zaps" />
      <div class="res" title="Capital"><i class="ico ico-cap">$</i><b id="res-capital">0</b></div>
      <div class="res" title="Grid capacity"><i class="ico ico-grid"></i><b id="res-grid">0</b><span>MW</span></div>
      <div class="res" title="Permits"><i class="ico ico-permit"></i><b id="res-permits">0</b></div>
      <div class="res" title="Copper"><i class="ico ico-copper"></i><b id="res-copper">0</b></div>
      <div class="res" title="Steel"><i class="ico ico-steel"></i><b id="res-steel">0</b></div>
    </header>

    <div class="age-plate panel" id="age-plate">
      <p id="age-name">PILOT AGE</p>
      <p id="pop">0/0</p>
      <button type="button" id="btn-age">Advance</button>
    </div>

    <p id="objective" class="objective panel">Select a crew. Raise a DC row.</p>

    <div class="cmd panel" id="cmd" aria-label="Command card"></div>

    <section class="select-panel panel" id="select-panel" aria-label="Selection">
      <div id="select-swatch"></div>
      <div>
        <b id="select-name">No selection</b>
        <p id="select-meta">Left-drag a box. Right-click to move or work.</p>
        <div class="bar"><i id="select-bar"></i></div>
      </div>
    </section>

    <canvas id="minimap" class="panel" aria-label="Minimap"></canvas>

    <div id="age-banner" class="age-banner" hidden>FLEET AGE</div>
    <p id="help" class="help">Drag select · Right-click move · Arrows pan · Wheel zoom</p>

    <script src="game.js?v=empire-aoe"></script>
  </body>
</html>
