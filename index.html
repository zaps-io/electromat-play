<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ELECTROMAT Night Shift — Station 001</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./assets/index.css">
  </head>
  <body data-phase="title">
    <div class="stage" id="stage">
      <div class="atmosphere" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>
      <div class="console" id="console">
        <header class="mast" id="mast">
          <img class="mast-word" alt="Zaps" />
          <p class="mast-id">001</p>
        </header>
        <div class="plate" id="plate">
          <div class="plate-lip" aria-hidden="true"></div>
          <div class="glass">
            <div id="screen"></div>
            <div class="scan" aria-hidden="true"></div>
            <div class="scan-bar" aria-hidden="true"></div>
            <div class="vignette" aria-hidden="true"></div>
          </div>
        </div>
        <div class="chin" id="chin">
          <button class="rocker" id="rocker" data-act="power" type="button" aria-label="Power">
            <span class="rocker-well">
              <span class="rocker-paddle">
                <span class="rk-on">ON</span>
                <span class="rk-off">OFF</span>
              </span>
            </span>
          </button>
          <div class="cass" id="cass" hidden>
            <div class="cass-well">
              <button class="cass-door" id="cass-door" type="button" aria-label="Cassette">
                <img class="cass-thumb" id="cass-thumb" alt="" hidden />
                <span class="cass-seat" id="cass-lab"></span>
              </button>
              <div class="cass-tray" id="cass-tray">
                <button class="tape" data-cass="FAST-CHG" type="button"><img alt="" /><span>FAST</span></button>
                <button class="tape" data-cass="LOAD-BAL" type="button"><img alt="" /><span>BAL</span></button>
                <button class="tape" data-cass="BESS-BST" type="button"><img alt="" /><span>BESS</span></button>
                <button class="tape" data-cass="DIAG" type="button"><img alt="" /><span>DIAG</span></button>
              </div>
            </div>
          </div>
          <div class="chin-right">
            <button class="mute" id="mute" data-act="mute" type="button" aria-label="Mute"></button>
            <div class="leds" id="leds" aria-hidden="true">
              <i class="led" id="ledPower" title="POWER"></i>
              <i class="led" id="ledBus" title="BUS"></i>
              <i class="led" id="ledBess" title="BESS"></i>
              <i class="led" id="ledKiosk" title="KIOSK"></i>
              <i class="led" id="ledAlarm" title="ALARM"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="./assets/index.js"></script>
  </body>
</html>
