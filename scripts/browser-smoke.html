<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Empire browser smoke</title>
  </head>
  <body>
    <pre id="out">running…</pre>
    <iframe id="g" src="/?shot=empty" style="position:absolute;left:-9999px;width:1280px;height:800px;border:0"></iframe>
    <script>
      const out = document.getElementById("out");
      const frame = document.getElementById("g");
      const report = (obj) => {
        out.textContent = JSON.stringify(obj, null, 2);
        document.title = obj.ok ? "SMOKE PASS" : "SMOKE FAIL";
      };
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      frame.addEventListener("load", async () => {
        try {
          await wait(800);
          const w = frame.contentWindow;
          const d = frame.contentDocument;
          const smoke = w.__EMPIRE_SMOKE__;
          if (!smoke) throw new Error("no __EMPIRE_SMOKE__");
          const before = {
            site: smoke.getSite(),
            selected: smoke.getSelected(),
            paused: smoke.paused(),
            speed: smoke.getState().speed,
          };
          const dc = d.querySelector('[data-kit="dc"]');
          if (!dc) throw new Error("no DC tray button");
          dc.click();
          await wait(250);
          const state = smoke.getState();
          const after = {
            site: smoke.getSite(),
            selected: smoke.getSelected(),
            paused: smoke.paused(),
            queue: state.queue,
            crews: state.queue.filter((q) => q.faction === "zaps").length,
          };
          const flag = smoke.nearestCity(400, 370);
          const tuc = smoke.nearestCity(455, 545);
          const flagDeployed = after.queue.some((q) => q.city === "flagstaff" && q.type === "dc");

          smoke.enterSite("la");
          await wait(150);
          const laWhy = smoke.blockedReason("dc", "la");
          const laCan = smoke.canDeploy("dc", "la");
          const laQueued = smoke.enqueue("dc", "la");
          const laJobs = smoke.getState().queue.filter((q) => q.city === "la" && q.faction === "zaps");
          const laBtn = d.querySelector('[data-kit="dc"]');
          const laChip = laBtn ? laBtn.textContent : "";
          const dallasWhy = smoke.blockedReason("dc", "dallas");
          const denverWhy = smoke.blockedReason("mcs", "denver");
          const flagWhy = smoke.blockedReason("dc", "flagstaff");
          const flagStillOpen = flagWhy !== "RIVAL SITE";

          smoke.enterSite("flagstaff");
          smoke.setHover("dc");
          await wait(80);
          const consequence = d.querySelector("#site-consequence");
          const consequenceText = consequence ? consequence.textContent : "";
          const smartAfterOne = smoke.smartSlot("flagstaff");
          const read = smoke.placementRead("flagstaff", "dc");

          smoke.getState().cities.vegas.sites.zaps.dc = 2;
          smoke.getState().cities.vegas.sites.voltspan.dc = 2;
          smoke.getState().cities.vegas.price.zaps = 0.4;
          smoke.getState().cities.vegas.price.voltspan = 0.36;
          const threat = smoke.threat("vegas");

          smoke.pickPath("corridor");
          const corridorPlan = smoke.rivalPlan("la");
          smoke.pickPath("amenity");
          const amenityPlan = smoke.rivalPlan("la");
          const buildId = d.querySelector('meta[name="empire-build"]');
          const buildName = buildId ? buildId.content : "";

          const ok =
            before.site === "flagstaff" &&
            after.site === "flagstaff" &&
            after.selected === "flagstaff" &&
            after.paused === true &&
            flagDeployed &&
            flag.id === "flagstaff" &&
            tuc.id === "tucson" &&
            laWhy === "RIVAL SITE" &&
            laCan === false &&
            laQueued === false &&
            laJobs.length === 0 &&
            /RIVAL SITE/.test(laChip) &&
            dallasWhy === "RIVAL SITE" &&
            denverWhy === "RIVAL SITE" &&
            flagStillOpen &&
            smoke.rivalSite("la") === true &&
            smoke.rivalSite("flagstaff") === false &&
            smoke.build === "rts-yard-17" &&
            buildName === "rts-yard-17" &&
            smoke.goldilocks === 0.76 &&
            smartAfterOne === 1 &&
            /est\./.test(read) &&
            /est\./.test(consequenceText) &&
            threat &&
            threat.chip === "UNDERCUT" &&
            threat.action === "price" &&
            corridorPlan === "lounge" &&
            amenityPlan === "mcs";

          report({
            ok,
            before,
            after,
            flag: flag.id,
            tucson: tuc.id,
            hits: { flagstaff: flag.id, tucson: tuc.id },
            ownership: {
              laWhy,
              laCan,
              laQueued,
              laJobs: laJobs.length,
              laChip,
              dallasWhy,
              denverWhy,
              flagWhy,
              flagStillOpen,
              rivalLa: smoke.rivalSite("la"),
              rivalFlag: smoke.rivalSite("flagstaff"),
            },
            placement: { smartAfterOne, read, consequenceText },
            threat,
            fork: { corridorPlan, amenityPlan },
            buildName,
          });
        } catch (err) {
          report({ ok: false, error: String(err && err.stack ? err.stack : err) });
        }
      });
    </script>
  </body>
</html>
