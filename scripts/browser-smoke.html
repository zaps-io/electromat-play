<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Empire browser smoke</title>
  </head>
  <body>
    <pre id="out">running…</pre>
    <iframe id="g" src="/?shot=empty" style="position:absolute;left:-9999px;width:1280px;height:800px;border:0"></iframe>
    <script>
      const out = document.getElementById("out");
      const frame = document.getElementById("g");
      const report = (obj) => {
        out.textContent = JSON.stringify(obj, null, 2);
        document.title = obj.ok ? "SMOKE PASS" : "SMOKE FAIL";
      };
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      frame.addEventListener("load", async () => {
        try {
          await wait(800);
          const w = frame.contentWindow;
          const d = frame.contentDocument;
          const smoke = w.__EMPIRE_SMOKE__;
          if (!smoke) throw new Error("no __EMPIRE_SMOKE__");
          const before = {
            site: smoke.getSite(),
            selected: smoke.getSelected(),
            paused: smoke.paused(),
            speed: smoke.getState().speed,
          };
          const dc = d.querySelector('[data-kit="dc"]');
          if (!dc) throw new Error("no DC tray button");
          dc.click();
          await wait(250);
          const state = smoke.getState();
          const after = {
            site: smoke.getSite(),
            selected: smoke.getSelected(),
            paused: smoke.paused(),
            queue: state.queue,
            crews: state.queue.filter((q) => q.faction === "zaps").length,
          };
          const flag = smoke.nearestCity(400, 370);
          const tuc = smoke.nearestCity(455, 545);
          const flagDeployed = after.queue.some((q) => q.city === "flagstaff" && q.type === "dc");

          smoke.enterSite("la");
          await wait(150);
          const laWhy = smoke.blockedReason("dc", "la");
          const laCan = smoke.canDeploy("dc", "la");
          const laQueued = smoke.enqueue("dc", "la");
          const laJobs = smoke.getState().queue.filter((q) => q.city === "la" && q.faction === "zaps");
          const laBtn = d.querySelector('[data-kit="dc"]');
          const laChip = laBtn ? laBtn.textContent : "";
          const dallasWhy = smoke.blockedReason("dc", "dallas");
          const denverWhy = smoke.blockedReason("mcs", "denver");
          const flagWhy = smoke.blockedReason("dc", "flagstaff");
          const flagStillOpen = flagWhy !== "RIVAL SITE";

          smoke.enterSite("flagstaff");
          smoke.setHover("dc");
          await wait(80);
          const consequence = d.querySelector("#site-consequence");
          const consequenceText = consequence ? consequence.textContent : "";
          const smartAfterOne = smoke.smartSlot("flagstaff");
          const read = smoke.placementRead("flagstaff", "dc");

          smoke.getState().cities.vegas.sites.zaps.dc = 2;
          smoke.getState().cities.vegas.sites.voltspan.dc = 2;
          smoke.getState().cities.vegas.price.zaps = 0.4;
          smoke.getState().cities.vegas.price.voltspan = 0.36;
          const threat = smoke.threat("vegas");

          smoke.pickPath("corridor");
          const corridorPlan = smoke.rivalPlan("la");
          smoke.pickPath("amenity");
          const amenityPlan = smoke.rivalPlan("la");
          const buildId = d.querySelector('meta[name="empire-build"]');
          const buildName = buildId ? buildId.content : "";

          const cashBeforeScout = smoke.getState().cash;
          const launched = smoke.launchScout("phoenix");
          const cashAfterScout = smoke.getState().cash;
          const flightCities = smoke.flights().map((s) => s.city);
          smoke.finishScouts();
          const pulseMonths = smoke.pulse("phoenix");
          const refreshPrice = smoke.scoutPrice("phoenix");
          const cashBeforeRefresh = smoke.getState().cash;
          const refreshed = smoke.launchScout("phoenix");
          const cashAfterRefresh = smoke.getState().cash;
          const second = smoke.launchScout("tucson");
          const cashAfterSecond = smoke.getState().cash;
          const secondFlight = smoke.flights().some((s) => s.city === "tucson");

          smoke.getState().skirmish = {
            city: "vegas",
            rival: "voltspan",
            kind: "price",
            you: 30,
            them: 44,
            left: 2,
          };
          smoke.getState().cities.vegas.sites.zaps.dc = 2;
          smoke.getState().cities.vegas.sites.voltspan.dc = 2;
          smoke.enterSite("vegas");
          await wait(80);
          const lane = d.querySelector(".skirmish-lane");
          const pushed = smoke.pushSkirmish();
          const youAfter = smoke.skirmish() ? smoke.skirmish().you : 0;

          smoke.enterSite("flagstaff");
          await wait(40);
          const crewTokens = d.querySelectorAll("#site-yard .crew-token").length;
          const cycled = smoke.cycleCrew(1, "flagstaff");
          const crew1 = smoke.crews()[0];

          smoke.enterSite("la");
          await wait(40);
          const laCrews = d.querySelectorAll("#site-yard .crew-token").length;
          smoke.enterSite("phoenix");
          await wait(40);
          const detector = d.querySelector(".scout-detector");
          const pin = d.querySelector('.city-node[data-city="phoenix"].scouted .scout-pin');
          const echoTucson = smoke.echo("tucson");
          const dallasFog = d.querySelector('.city-node[data-city="dallas"].fogged');
          const laFog = d.querySelector('.city-node[data-city="la"].fogged');
          const tucsonIntel = d.querySelector('.city-node[data-city="tucson"].intel-near');
          const hop = d.querySelectorAll(".corridor-hop").length;
          const tug = d.querySelector('.city-node[data-city="vegas"] .pin-tug');
          const youBeforePin = smoke.skirmish() ? smoke.skirmish().you : 0;
          if (tug) tug.click();
          const youAfterPin = smoke.skirmish() ? smoke.skirmish().you : youBeforePin;
          const assigned = smoke.assignWaypoint("flagstaff");
          const crewAfter = smoke.crews()[0];
          const flagPip = d.querySelector('.city-node[data-city="flagstaff"] .crew-token');
          const tucsonPip = d.querySelector('.city-node[data-city="tucson"] .crew-token');
          const phxPips = d.querySelectorAll('.city-node[data-city="phoenix"] .crew-token').length;

          const ok =
            before.site === "flagstaff" &&
            after.site === "flagstaff" &&
            after.selected === "flagstaff" &&
            after.paused === true &&
            flagDeployed &&
            flag.id === "flagstaff" &&
            tuc.id === "tucson" &&
            laWhy === "RIVAL SITE" &&
            laCan === false &&
            laQueued === false &&
            laJobs.length === 0 &&
            /RIVAL SITE/.test(laChip) &&
            dallasWhy === "RIVAL SITE" &&
            denverWhy === "RIVAL SITE" &&
            flagStillOpen &&
            smoke.rivalSite("la") === true &&
            smoke.rivalSite("flagstaff") === false &&
            smoke.build === "rts-yard-20" &&
            buildName === "rts-yard-20" &&
            smoke.goldilocks === 0.76 &&
            smartAfterOne === 1 &&
            /est\./.test(read) &&
            /est\./.test(consequenceText) &&
            threat &&
            threat.chip === "UNDERCUT" &&
            threat.action === "price" &&
            corridorPlan === "lounge" &&
            amenityPlan === "mcs" &&
            launched === true &&
            cashBeforeScout - cashAfterScout === 40000 &&
            flightCities.indexOf("phoenix") !== -1 &&
            pulseMonths >= 4 &&
            refreshPrice === 0 &&
            refreshed === true &&
            cashAfterRefresh === cashBeforeRefresh &&
            second === true &&
            cashAfterRefresh - cashAfterSecond === 40000 &&
            secondFlight === true &&
            lane &&
            pushed === true &&
            youAfter > 30 &&
            crewTokens === 3 &&
            cycled === true &&
            crew1.task === "respond" &&
            laCrews === 0 &&
            detector &&
            pin &&
            /SCOUTED|DET/.test((detector.textContent || "") + (pin.textContent || "")) &&
            echoTucson > 0 &&
            Boolean(dallasFog) &&
            Boolean(laFog) &&
            Boolean(tucsonIntel) &&
            hop > 0 &&
            Boolean(tug) &&
            youAfterPin > youBeforePin &&
            assigned === true &&
            crewAfter.task === "respond" &&
            crewAfter.city === "flagstaff" &&
            Boolean(flagPip) &&
            Boolean(tucsonPip) &&
            phxPips === 1;

          report({
            ok,
            before,
            after,
            flag: flag.id,
            tucson: tuc.id,
            hits: { flagstaff: flag.id, tucson: tuc.id },
            ownership: {
              laWhy,
              laCan,
              laQueued,
              laJobs: laJobs.length,
              laChip,
              dallasWhy,
              denverWhy,
              flagWhy,
              flagStillOpen,
              rivalLa: smoke.rivalSite("la"),
              rivalFlag: smoke.rivalSite("flagstaff"),
            },
            placement: { smartAfterOne, read, consequenceText },
            threat,
            fork: { corridorPlan, amenityPlan },
            scout: {
              launched,
              spent: cashBeforeScout - cashAfterScout,
              pulseMonths,
              refreshPrice,
              refreshed,
              second,
              secondSpent: cashAfterRefresh - cashAfterSecond,
            },
            skirmishPush: { pushed, youAfter, lane: Boolean(lane) },
            crews: { crewTokens, cycled, crew1, laCrews, detector: Boolean(detector), pin: pin ? pin.textContent : "" },
            fog: { echoTucson, dallasFog: Boolean(dallasFog), laFog: Boolean(laFog), tucsonIntel: Boolean(tucsonIntel), hop },
            pinFight: { tug: Boolean(tug), youBeforePin, youAfterPin },
            waypoint: { assigned, crewAfter, flagPip: Boolean(flagPip), tucsonPip: Boolean(tucsonPip), phxPips },
            buildName,
          });
        } catch (err) {
          report({ ok: false, error: String(err && err.stack ? err.stack : err) });
        }
      });
    </script>
  </body>
</html>
