name: Assemble play assets

on:
  push:
    branches: [main]
    paths:
      - 'assets/parts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assemble-assets
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Concatenate parts into final assets
        run: |
          set -euo pipefail
          mkdir -p assets/parts
          css_n=$(ls assets/parts/css_*.txt 2>/dev/null | wc -l)
          js_n=$(ls assets/parts/js_*.txt 2>/dev/null | wc -l)
          css_b=0
          js_b=0
          if [ "$css_n" -gt 0 ]; then css_b=$(cat assets/parts/css_*.txt | wc -c); fi
          if [ "$js_n" -gt 0 ]; then js_b=$(cat assets/parts/js_*.txt | wc -c); fi
          echo "css parts=$css_n bytes=$css_b js parts=$js_n bytes=$js_b"
          if [ "$css_b" -ne 467310 ] || [ "$js_b" -ne 687985 ]; then
            echo "Parts not complete yet; skipping assemble"
            exit 0
          fi
          mkdir -p assets
          cat assets/parts/css_*.txt > assets/index.css
          cat assets/parts/js_*.txt > assets/index.js
          wc -c assets/index.css assets/index.js
          test "$(wc -c < assets/index.css)" -eq 467310
          test "$(wc -c < assets/index.js)" -eq 687985
      - name: Commit assembled assets
        run: |
          set -euo pipefail
          css_b=0
          js_b=0
          if ls assets/parts/css_*.txt >/dev/null 2>&1; then css_b=$(cat assets/parts/css_*.txt | wc -c); fi
          if ls assets/parts/js_*.txt >/dev/null 2>&1; then js_b=$(cat assets/parts/js_*.txt | wc -c); fi
          if [ "$css_b" -ne 467310 ] || [ "$js_b" -ne 687985 ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/index.css assets/index.js
          if git diff --cached --quiet; then
            echo "No assembled-asset changes"
            exit 0
          fi
          git commit -m "Add play assets"
          git push
