name: Assemble play assets

on:
  push:
    branches: [main]
    paths:
      - 'assets/parts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assemble-assets
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Concatenate parts into final assets
        run: |
          set -euo pipefail
          css_n=$(ls assets/parts/css_*.txt 2>/dev/null | wc -l)
          js_n=$(ls assets/parts/js_*.txt 2>/dev/null | wc -l)
          echo "css parts=$css_n js parts=$js_n"
          if [ "$css_n" -lt 6 ] || [ "$js_n" -lt 9 ]; then
            echo "Not all parts uploaded yet; skipping assemble"
            exit 0
          fi
          mkdir -p assets
          cat assets/parts/css_*.txt > assets/index.css
          cat assets/parts/js_*.txt > assets/index.js
          wc -c assets/index.css assets/index.js
          test "$(wc -c < assets/index.css)" -eq 467310
          test "$(wc -c < assets/index.js)" -eq 687985
      - name: Commit assembled assets
        run: |
          set -euo pipefail
          css_n=$(ls assets/parts/css_*.txt 2>/dev/null | wc -l)
          js_n=$(ls assets/parts/js_*.txt 2>/dev/null | wc -l)
          if [ "$css_n" -lt 6 ] || [ "$js_n" -lt 9 ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/index.css assets/index.js
          if git diff --cached --quiet; then
            echo "No assembled-asset changes"
            exit 0
          fi
          git commit -m "Add play assets"
          git push
